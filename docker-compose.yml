version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ruralroots-postgres
    environment:
      POSTGRES_DB: ruralrootsdb
      POSTGRES_USER: ruralroots
      POSTGRES_PASSWORD: ruralrootspassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ruralroots -d ruralrootsdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ruralroots-backend
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ruralrootsdb
      SPRING_DATASOURCE_USERNAME: ruralroots
      SPRING_DATASOURCE_PASSWORD: ruralrootspassword
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      JWT_SECRET: cjI4OWZqODkzMjQ4OTJmMzg0OTJmMzg0OTJmMzg0OTJmMzg0OTI
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ruralroots-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
