server:
  port: ${PORT:8085}
  compression:
    enabled: true

spring:
  application:
    name: ruralroots-backend
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driverClassName: org.postgresql.Driver
    hikari:
      pool-name: RuralRootsProdHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: false
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

jwt:
  secret: ${JWT_SECRET}
  expirationMs: ${JWT_EXPIRATION_MS:2592000000}

twilio:
  account:
    sid: ${TWILIO_ACCOUNT_SID:MOCK_TWILIO_SID}
  auth:
    token: ${TWILIO_AUTH_TOKEN:MOCK_TWILIO_TOKEN}
  phone:
    number: ${TWILIO_PHONE_NUMBER:+15005550006}
